    svg[data-artwork='tea-cup'][data-motion='on'] .ld-tea-steam {
      animation: ld-tea-rise 2.4s ease-in-out infinite;
    }
    svg[data-artwork='tea-cup'][data-motion='on'] .ld-tea-steam-two {
      animation-delay: 0.4s;
    }
    svg[data-artwork='tea-cup'][data-motion='on'] .ld-tea-steam-three {
      animation-delay: 0.8s;
    }
    @keyframes ld-tea-rise {
      0%,
      100% {
        opacity: 0.28;
        transform: translateY(1px);
      }
      45% {
        opacity: 0.8;
        transform: translateY(-2px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      svg[data-artwork='tea-cup'][data-motion='on'] .ld-tea-steam {
        animation: none;
      }
    }
  </style>
