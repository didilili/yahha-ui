  <style>
    svg[data-artwork='page-wait'] .ld-page-leaf {
      transform-origin: 120px 78px;
    }
    svg[data-artwork='page-wait'][data-motion='on'] .ld-page-leaf {
      animation: ld-page-turn 2.8s ease-in-out infinite;
    }
    @keyframes ld-page-turn {
      0%,
      15%,
      100% {
        opacity: 1;
        transform: skewY(0deg) scaleX(1);
      }
      40% {
        opacity: 1;
        transform: skewY(-5deg) scaleX(0.82);
      }
      58% {
        opacity: 0.85;
        transform: skewY(-12deg) scaleX(0.12);
      }
      59% {
        opacity: 0;
        transform: skewY(-12deg) scaleX(0.12);
      }
      76% {
        opacity: 0;
        transform: skewY(0deg) scaleX(1);
      }
      88% {
        opacity: 1;
        transform: skewY(0deg) scaleX(1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      svg[data-artwork='page-wait'][data-motion='on'] .ld-page-leaf {
        animation: none;
      }
    }
  </style>
