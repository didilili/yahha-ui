  <style>
    svg[data-artwork='load-error'] .ld-state-loose-corner {
      transform-origin: 161px 55px;
    }
    svg[data-artwork='load-error'][data-motion='on'] .ld-state-loose-corner {
      animation: ld-state-paper-settle 0.48s ease-out both;
    }
    @keyframes ld-state-paper-settle {
      0% {
        transform: rotate(-8deg);
      }
      52% {
        transform: rotate(3deg);
      }
      78% {
        transform: rotate(-1.5deg);
      }
      100% {
        transform: rotate(0deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      svg[data-artwork='load-error'][data-motion='on'] .ld-state-loose-corner {
        animation: none;
      }
    }
