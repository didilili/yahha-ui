name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check engineering helpers
        run: npm run check:scripts

      - name: Check component documentation synchronization
        run: npm run check:docs

      - name: Check design contract
        run: npm run check:design

      - name: Check types
        run: npm run typecheck

      - name: Test components
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npm run build:demo

      - name: Check package exports
        run: npm run lint:package

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test installed package
        run: npm run test:package

      - name: Test documentation site
        run: npm run test:docs

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/release.yml
