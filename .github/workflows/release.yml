name: Release

on:
  workflow_call:

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: npm install --global npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 'chore(release): 更新版本与变更记录'
          commit-message: 'chore(release): 更新版本与变更记录'
