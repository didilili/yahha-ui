name: 组件或接入问题
description: 记录安装、样式或交互中遇到的问题。
body:
  - type: input
    id: version
    attributes:
      label: Yahha UI 版本
      placeholder: 例如 0.0.1；使用本地包时可查看 starter-manifest.json。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: React / React DOM、构建工具、浏览器与系统版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 如何重现
      description: 填写页面或组件、操作步骤，可附最小代码或截图。请去掉密钥与私人内容。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 若与动效有关，请说明是否开启系统“减少动态效果”。
    validations:
      required: true
